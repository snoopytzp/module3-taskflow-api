spring.application.name=taskflow-api

# =================================================
# H2 Database Configuration (Use PostgreSQL now) 
# =================================================
# Enables the H2 console, which is a UI for the H2 database.
#spring.h2.console.enabled=true
# The URL path to the H2 console.
#spring.h2.console.path=/h2
# The JDBC URL for the H2 database.
#spring.datasource.url=jdbc:h2:mem:taskflow-api

# ==================
# Use PostgreSQL
# ==================
# Server configuration
server.port=8080

# Database configuration (from Docker Compose environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA configuration - prevent startup failure when no entities exist
spring.jpa.hibernate.ddl-auto=create
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# ========================================
# Spring AI - OpenRouter Configuration
# ========================================
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.model=openrouter/free
spring.ai.openai.embedding.model=nvidia/llama-nemotron-embed-vl-1b-v2:free
spring.ai.openai.embedding.encoding-format=float